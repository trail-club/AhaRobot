# arm_trajectory_bridge.py, one node per arm (aha_bringup arms.launch.py).
# Format: aha_manipulation/arm_map.py.
#
# `joints` is the arm_node's `joint_names` in the same order (arms.launch.py).
# Position limits are the arm_node's (patches/astra_controller-trail-club-ver1004.patch,
# ARM_PROFILES) in radians, rounded inwards: the arm_node drops a whole command
# with one value outside them.
#
# `state_topic` is the arm_node's own joint states (arms.launch.py), not
# /joint_states: other publishers (joint_state_publisher) put the arm joints
# there too.

/**:
  ros__parameters:
    rate_hz: 50.0
    start_tolerance: 0.05
    path_tolerance: 0.3
    goal_tolerance: 0.03
    goal_time: 2.0
    state_timeout: 0.3

aha_left_arm_bridge:
  ros__parameters:
    controller_name: left_arm_controller
    command_topic: /left/arm/joint_command
    state_topic: /left/arm/joint_states
    joints: [joint_l2, joint_l3, joint_l4, joint_l5, joint_l6]
    joint_l2: {min: -1.5184, max: 1.4835, max_velocity: 1.0, max_acceleration: 2.0}
    joint_l3: {min: -1.0821, max: 1.4660, max_velocity: 1.0, max_acceleration: 2.0}
    joint_l4: {min: -2.8623, max: 2.8797, max_velocity: 1.0, max_acceleration: 2.0}
    joint_l5: {min: -2.7227, max: 1.4311, max_velocity: 1.0, max_acceleration: 2.0}
    joint_l6: {min: -2.7401, max: 1.6231, max_velocity: 1.0, max_acceleration: 2.0}

aha_right_arm_bridge:
  ros__parameters:
    controller_name: right_arm_controller
    command_topic: /right/arm/joint_command
    state_topic: /right/arm/joint_states
    joints: [joint_r2, joint_r3, joint_r4, joint_r5, joint_r6]
    joint_r2: {min: -1.5184, max: 1.5358, max_velocity: 1.0, max_acceleration: 2.0}
    joint_r3: {min: -1.5009, max: 1.2391, max_velocity: 1.0, max_acceleration: 2.0}
    joint_r4: {min: -2.3911, max: 2.3212, max_velocity: 1.0, max_acceleration: 2.0}
    joint_r5: {min: -1.3264, max: 2.7227, max_velocity: 1.0, max_acceleration: 2.0}
    joint_r6: {min: -2.7401, max: 2.7401, max_velocity: 1.0, max_acceleration: 2.0}

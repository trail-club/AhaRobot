# object_perception (launch/objects.launch.py). The DGX connection,
# target_frame and objects_config are launch arguments.
object_perception:
  ros__parameters:
    # SAM 3.1 phrases for the candidates; the VLM names each candidate with a
    # label of the object list or none.
    prompts: [item, food, small box, box, can, bottle, fruit, cup, bowl, plate, fork, spoon, knife, toy]
    threshold: 0.4          # SAM 3.1 candidate score
    max_candidates: 24      # per image, best score first
    vlm_model: qwen3.8-27b  # Qwen3.8 server on the DGX (tools/local-llm)
    max_size: 0.6           # m; larger boxes (furniture under a mask) are dropped
    border_px: 2            # px; masks this close to the image edge are cut off and dropped
    robot_frames: [link_l6, link_l7l, link_l7r, link_r6, link_r7l, link_r7r]  # gripper links the camera sees
    robot_margin: 0.12      # m; objects this close to a robot_frames link are the robot
    merge_distance: 0.05    # m; one object when two candidates get the same label this close
    max_rate: 1.0           # images/s sent to the DGX at most; one at a time
    request_timeout: 120.0  # s to wait for one image before skipping it; the DGX gives up on the VLM first
    gate: 0.08              # m; a sighting farther from every track starts a new one (half for another label)
    forget_after: 120.0     # s of image time without a sighting before a track is dropped
    debug_dir: ""           # non-empty: save each image with its candidates and labels there

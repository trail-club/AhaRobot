name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

jobs:
  claude-review:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.

            Focus on high-confidence issues:
            - bugs and incorrect behavior
            - security problems
            - concurrency or race-condition issues
            - missing error handling
            - backwards compatibility
            - performance regressions
            - incorrect assumptions or edge cases

            Read AGENTS.md at the repository root and follow its project conventions:
            - AhaRobot-specific code belongs in overlay_ws/.
            - upstream/* is managed as submodules; changes belong in fork PRs and submodule SHA updates.
            - For ROS topic, frame, or message changes, check downstream use and docs/interfaces.md.
            - Consult the relevant package README and docs for affected areas.

            Do not comment on minor formatting or stylistic issues
            that should be handled by linters.

            Prefer inline comments on the relevant code.
            Only report issues that are actionable.

            Write review comments and the final summary in Japanese.

          claude_args: |
            --model claude-sonnet-5-5
            --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

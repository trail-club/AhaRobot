# Overlay for NVIDIA GPU pass-through.
# Requires the NVIDIA Container Toolkit on the host (Linux native or WSL2).
# Applied automatically when run_docker_container.py detects nvidia-smi.
services:
  aha_project:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Prefer hardware GL when the NVIDIA runtime is available.
      - LIBGL_ALWAYS_SOFTWARE=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# Velocity limits equal the patched URDF limits (aha_description/scripts/patch_limits.py).
# Accelerations are conservative choices (not measured): 2.0 rad/s^2 for arm joints,
# 0.3 m/s^2 for the lift, 0.5 m/s^2 for the fingers.
# The lift is planned from 5 mm above its stop. On the stop it reads slightly
# negative positions (rejected as an out-of-bounds start state) and in Gazebo it
# can stick there; the simulation starts it at 0.01 m.
# Planned trajectories are scaled to 50 % by default.
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  joint_r1:
    has_position_limits: true
    min_position: 0.005
    max_position: 1.2
    has_velocity_limits: true
    max_velocity: 0.3
    has_acceleration_limits: true
    max_acceleration: 0.3
  joint_r2:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 2.0

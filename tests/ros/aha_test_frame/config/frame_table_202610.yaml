# Provisional model of the real robot as built in 2026-10 (aha_test_frame/frame.py):
# arms and head on a frame of 30 mm aluminum extrusions standing on a table,
# no mobile base and no lifts.
#
# base_link: on the table top below the center of the center column;
# x forward (the camera's direction), y left, z up. Lengths in m.
# measured: by tape (2026-10-25). photo: estimated from photos, to be measured.

base_height: 0.38  # measured: floor -> table top

head:
  # The head is Astra's (HeadYaw base, pan servo, tilt bracket): the tilt axis
  # crosses the pan axis, and the base's top is 0.0976 m above them. The base
  # hangs at the end of the 30x60 bar (top at the column top, 0.50 m,
  # measured). x: 12 cm in front of the column (photo estimate 9 cm, 3 cm
  # further forward by the user's check of the model).
  # z: the base's bottom face flush with the bar's bottom face (0.47; the
  # user's check of the model, 2026-11-01), 0.059 m above the axes -> 0.411,
  # the base's top 9 mm above the column top.
  pan_xyz: [0.12, 0.0, 0.411]
  tilt_offset: [0.0, 0.0, 0.0]

# camera: rpy from camera_plane_calibrate.py against the floor, head:=imu (tilt
# 17.9 deg down, pan 0), 2026-10-25 (docs/context/camera.md). xyz is the
# bracket design (sensors.xacro, the camera's back face on the mount plate):
# the calibrated xyz moved the camera 15 mm up and 5 mm into the plate.
camera: {xyz: [0.052525, 0.0, 0.0], rpy: [1.5410, 0.0101, 0.0005]}

arms:
  # shoulder_xyz: joint_<l|r>2 axis at the middle of the upper arm bar, which
  # is 0.02 m below the bar's top (link_<l|r>2 mesh). Bar top, measured:
  # left 0.264, right 0.242. The motor block is mounted on the outer face of
  # the tower (y +-0.16) at the second upright from the back (x 0.03); the
  # axis is 0.072 m out from the mounting face (link_<l|r>1 mesh: face at
  # -0.004, axis at 0.068).
  # yaw: left as in the Astra URDF, not checked on the robot. Right: yaw, the
  # elbow offset and the height (0.222 measured) from arm_cloud_calibrate.py
  # (docs/context/frame.md).
  # joint_offsets (optional): {joint_<l|r>N: rad} added to the readings of the
  # vertical joints 2..4 (aha_test_frame/frame.py), e.g. joint_r3: -0.12.
  left: {shoulder_xyz: [0.03, 0.232, 0.244], yaw: 1.5708}
  right: {shoulder_xyz: [0.03, -0.232, 0.202], yaw: -1.5234, joint_offsets: {joint_r3: 0.035}}

# Aluminum profiles of 30 mm modules, centerlines (from -> to); section
# [width, depth] (aha_test_frame/frame.py).
extrusions:
  # Center column: two 30x30 bars side by side, measured 0.50 m high; stands
  # on the table behind the bottom profile.
  - {name: column, from: [0.0, 0.0, 0.0], to: [0.0, 0.0, 0.50], section: [0.06, 0.03]}
  # 30x60 bar on the column's front face, top flush with the column top, up to
  # the head base: the base's rear face (60 mm wide, from its bottom plate up
  # to the bar's top) is 0.05 m behind the pan axis, so the bar ends at
  # pan - 0.05 (the user's check of the model, 2026-11-01). Only the base's
  # 3 mm bottom plate reaches 0.01 m further back, under the bar's end.
  - {name: head_bar, from: [0.015, 0.0, 0.485], to: [0.07, 0.0, 0.485], section: [0.06, 0.03]}
  # Arm towers: 30x120 profiles (x 0 to 0.09 between the slot centers),
  # outer faces 0.32 apart (measured); height (photo).
  - {name: left_tower, from: [0.045, 0.145, 0.0], to: [0.045, 0.145, 0.32], section: [0.03, 0.12]}
  - {name: right_tower, from: [0.045, -0.145, 0.0], to: [0.045, -0.145, 0.32], section: [0.03, 0.12]}
  # Bottom profile, 30x60 and 0.26 m long (measured), between the towers'
  # middle slots.
  - {name: bottom, from: [0.045, -0.13, 0.015], to: [0.045, 0.13, 0.015], section: [0.06, 0.03]}

[project]
name = "aharobot-sam31-validation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sam3",
    "setuptools>=70,<81",
    "numpy>=1.26,<2",
    "Pillow>=11,<13",
    "einops>=0.8,<1",
    "pycocotools>=2.0.10,<3",
    "scipy>=1.13,<2",
    "psutil>=6,<8",
    "timm>=1.0.17,<2",
    "ftfy==6.1.1",
    "regex",
    "iopath>=0.1.10,<0.2",
    "huggingface-hub>=0.34,<2",
    "tqdm",
    "typing-extensions",
]

[tool.uv]
package = false
required-version = ">=0.12.23"
# Supplied by the CUDA base image, not the PyPI dependency resolver.
exclude-dependencies = ["torch", "torchvision", "triton"]

[tool.uv.sources]
sam3 = { path = "../../../../upstream/sam3" }

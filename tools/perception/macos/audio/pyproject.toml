[project]
name = "aharobot-audio-macos"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=11,<13",
    "pyyaml>=6,<7",
    "scipy>=1.13,<2",
    "huggingface-hub>=0.34,<2",
    "transformers>=4.57,<5",
    "torch>=2.8,<3",
    "torchaudio>=2.8,<3",
    "silero-vad==6.2.3",
    "onnxruntime==1.30.0",
    "sounddevice==0.5.6",
]

[tool.uv]
package = false
required-version = ">=0.7.11"
